name: Linux CI

on:
  push:
    branches: [ master, "ci/**" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl:
          - "5.40"
          - "5.38"
        unicode:
          - false
          - true

    env:
      DBI_DSN: "dbi:ODBC:DRIVER=SQLite3"
      PERL_MM_USE_DEFAULT: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install unixODBC and SQLite ODBC driver
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc unixodbc-dev libsqliteodbc

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - name: Install Perl dependencies
        run: |
          cpanm --notest DBI Test::Simple Test::Output
          cpanm --notest Test::Pod Test::Pod::Coverage Test::Kwalitee Test::NoWarnings || true

      - name: Show ODBC configuration
        run: |
          perl -V
          odbcinst -j
          odbcinst -q -d || true

      - name: Configure
        env:
          DBD_ODBC_UNICODE: ${{ matrix.unicode && '1' || '' }}
        run: perl Makefile.PL

      - name: Build
        run: make

      - name: Test
        run: make test TEST_VERBOSE=1

  dbi-compat:
    name: DBI compatibility (Perl 5.40, DBI ${{ matrix.dbi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dbi:
          - "1.646"
          - "1.647"
          - "1.653"

    env:
      DBI_DSN: "dbi:ODBC:DRIVER=SQLite3"
      PERL_MM_USE_DEFAULT: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install unixODBC and SQLite ODBC driver
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc unixodbc-dev libsqliteodbc

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.40"

      - name: Install selected DBI and test dependencies
        run: |
          cpanm --notest "DBI@${{ matrix.dbi }}"
          cpanm --notest Test::Simple Test::Output Test::NoWarnings

      - name: Show versions and DBIXS state
        run: |
          perl -V
          perl -MDBI -MConfig -e 'print "DBI=$DBI::VERSION\nDBI.pm=$INC{\"DBI.pm\"}\narchlib=$Config{archlib}\n"'
          DBI_ARCH="$(perl -MDBI -MFile::Basename=dirname -e 'print dirname($INC{"DBI.pm"}) . "/auto/DBI"')"
          echo "DBI_ARCH=$DBI_ARCH"
          echo "--- dbixs_rev.h ---"
          cat "$DBI_ARCH/dbixs_rev.h" || true
          echo "--- DBIXS sql_type_cast / revision lines ---"
          grep -nE 'DBIXS_REVISION|DBISTATE_VERSION|sql_type_cast_svpv|DBIstcf_' "$DBI_ARCH/DBIXS.h" || true
          sha256sum "$DBI_ARCH/DBIXS.h" "$DBI_ARCH/dbixs_rev.h" || true
          odbcinst -j
          odbcinst -q -d || true

      - name: Probe DBI sql_type_cast scalar flags
        run: |
          perl -MDBI -MDevel::Peek -e '
            for my $flags (0, 1) {
              my $v = "100";
              my $rc = DBI::sql_type_cast($v, DBI::SQL_NUMERIC(), $flags);
              print "flags=$flags rc=$rc value=$v\n";
              Dump($v);
            }
          '

      - name: Configure and build
        run: |
          perl Makefile.PL
          make

      - name: Inspect DBD::ODBC DBIXS compile gate
        run: |
          DBI_ARCH="$(perl -MDBI -MFile::Basename=dirname -e 'print dirname($INC{"DBI.pm"}) . "/auto/DBI"')"
          REV="$(awk '/^#define DBIXS_REVISION / { print $3 }' "$DBI_ARCH/dbixs_rev.h")"
          echo "DBIXS_REVISION=$REV"
          if [ "$REV" -gt 13590 ]; then
            echo "DBD::ODBC sql_type_cast_svpv path: ENABLED"
          else
            echo "DBD::ODBC sql_type_cast_svpv path: DISABLED"
          fi
          grep -n -A45 -B5 'DBIXS_REVISION > 13590' dbdimp.c

      - name: Run sql_type_cast regression test
        run: make test TEST_FILES=t/sql_type_cast.t TEST_VERBOSE=1
